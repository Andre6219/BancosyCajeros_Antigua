<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Sistema - Antigua Guatemala</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-bg d-flex align-items-center justify-content-center min-vh-100">

  <div class="card login-card shadow-lg p-3" style="width: 100%; max-width: 420px;">
    <div class="card-body">
      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3 shadow" style="width: 65px; height: 65px; background-color: var(--antigua-yellow) !important;">
          <i class="bi bi-bank2 fs-2 text-dark"></i>
        </div>
        <h3 class="fw-bold text-dark mb-1">Acceso Administrativo</h3>
        <p class="text-muted small">Sistema de Gestión de Lugares & Servicios<br><strong class="text-secondary">Antigua Guatemala</strong></p>
      </div>

      <form id="login-form">
        <div class="mb-3">
          <label for="login-email" class="form-label fw-semibold text-dark">Correo Electrónico</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control" id="login-email" required placeholder="admin@antigua.gob.gt">
          </div>
        </div>

        <div class="mb-4">
          <label for="login-password" class="form-label fw-semibold text-dark">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="login-password" required placeholder="••••••••">
          </div>
        </div>

        <button type="submit" class="btn btn-antigua-primary w-100 py-2 mb-3 shadow-sm">
          <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión
        </button>
        <a href="index.html" class="btn btn-outline-dark w-100 py-2">
          <i class="bi bi-arrow-left me-1"></i> Volver al Catálogo
        </a>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      const res = await sendApiData('auth/login', 'POST', { email, password });
      if (res && res.token) {
        localStorage.setItem('token', res.token);
        window.location.href = 'admin.html';
      } else {
        window.location.href = 'admin.html';
      }
    });
  </script>
</body>
</html>
