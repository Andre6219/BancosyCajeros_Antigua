<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - Antigua Guatemala Services</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Estilos Personalizados -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="admin-bg d-flex flex-column min-vh-100">

  <!-- Navbar del Admin -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-antigua sticky-top shadow">
    <div class="container-fluid px-4">
      <a class="navbar-brand fs-4 fw-bold" href="admin.html">
        <i class="bi bi-building-gear text-warning me-2"></i> Panel de Administración
      </a>
      <div class="ms-auto d-flex align-items-center gap-2">
        <a href="index.html" class="btn btn-outline-light btn-sm">
          <i class="bi bi-eye me-1"></i> Ver Sitio Público
        </a>
        <button id="btn-logout" class="btn btn-antigua-primary btn-sm">
          <i class="bi bi-box-arrow-right me-1"></i> Cerrar Sesión
        </button>
      </div>
    </div>
  </nav>

  <!-- Contenido Principal -->
  <main class="container-fluid px-4 my-4 flex-grow-1">
    <div class="row g-4">
      
      <!-- Columna Izquierda: Formulario CRUD -->
      <div class="col-lg-5">
        <div class="card card-antigua shadow-lg">
          <div class="card-header card-header-antigua p-3">
            <h5 class="card-title mb-0 fw-bold" id="form-title">
              <i class="bi bi-plus-circle me-2"></i>Registrar Nuevo Lugar / Servicio
            </h5>
          </div>
          <div class="card-body p-4">
            <form id="place-form">
              <input type="hidden" id="form-id">

              <!-- Nombre del Lugar -->
              <div class="mb-3">
                <label for="form-name" class="form-label fw-semibold">Nombre del Lugar / Agencia *</label>
                <input type="text" class="form-control" id="form-name" required placeholder="Ej. Agencia Banrural Antigua">
              </div>

              <!-- Entidad (Ocupa todo el ancho al remover Categoría) -->
              <div class="mb-3">
                <label for="form-entity" class="form-label fw-semibold">Entidad *</label>
                <select class="form-select" id="form-entity" required>
                  <option value="">-- Seleccionar Entidad --</option>
                </select>
              </div>

              <!-- Ubicación / Municipio -->
              <div class="mb-3">
                <label for="form-location" class="form-label fw-semibold">Ubicación (Municipio) *</label>
                <select class="form-select" id="form-location" required>
                  <option value="">-- Seleccionar Municipio --</option>
                </select>
              </div>

              <!-- Dirección -->
              <div class="mb-3">
                <label for="form-address" class="form-label fw-semibold">Dirección / Referencia *</label>
                <input type="text" class="form-control" id="form-address" required placeholder="Ej. 5ta Avenida Norte #8">
              </div>

              <!-- Coordenadas Geográficas -->
              <div class="row g-2 mb-3">
                <div class="col-6">
                  <label for="form-lat" class="form-label fw-semibold">Latitud *</label>
                  <input type="number" step="any" class="form-control" id="form-lat" required placeholder="14.5586">
                </div>
                <div class="col-6">
                  <label for="form-lng" class="form-label fw-semibold">Longitud *</label>
                  <input type="number" step="any" class="form-control" id="form-lng" required placeholder="-90.7339">
                </div>
              </div>

              <!-- Descripción -->
              <div class="mb-4">
                <label for="form-description" class="form-label fw-semibold">Descripción</label>
                <textarea class="form-control" id="form-description" rows="3" placeholder="Información adicional sobre horarios, servicios o cajeros disponbles..."></textarea>
              </div>

              <!-- Botones de Acción -->
              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-antigua-primary w-100 py-2 shadow-sm" id="btn-save">
                  <i class="bi bi-floppy me-1"></i> Guardar Registro
                </button>
                <button type="button" class="btn btn-secondary py-2 d-none" id="btn-cancel">
                  Cancelar
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Columna Derecha: Tabla de Registros -->
      <div class="col-lg-7">
        <div class="card card-antigua shadow-lg">
          <div class="card-header card-header-antigua p-3 d-flex align-items-center justify-content-between">
            <h5 class="card-title mb-0 fw-bold">
              <i class="bi bi-list-stars me-2"></i>Registros Existentes
            </h5>
            <span class="badge bg-warning text-dark font-monospace" id="total-records">0 Registros</span>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead style="background-color: var(--antigua-yellow); color: var(--antigua-volcano);">
                  <tr>
                    <th class="py-3 ps-3">Nombre</th>
                    <th class="py-3 text-end pe-3">Acciones</th>
                  </tr>
                </thead>
                <tbody id="places-table-body">
                  <tr>
                    <td colspan="2" class="text-center py-4 text-muted">
                      Cargando registros del sistema...
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <footer class="navbar-antigua text-white text-center py-3 mt-auto">
    <div class="container">
      <p class="mb-0 small">&copy; 2026 Panel de Gestión - La Antigua Guatemala</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
