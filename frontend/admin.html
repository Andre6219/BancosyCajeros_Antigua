<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin - Antigua Guatemala</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="admin-bg d-flex flex-column min-vh-100">

  <nav class="navbar navbar-expand-lg navbar-dark navbar-antigua sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        <i class="bi bi-building-gear text-warning me-2"></i> Panel de Administración
      </a>
      <a href="index.html" class="btn btn-outline-light btn-sm">
        <i class="bi bi-eye me-1"></i> Ver Sitio Público
      </a>
    </div>
  </nav>

  <main class="container my-4 flex-grow-1">
    <div class="row">
      <!-- Formulario -->
      <div class="col-lg-5 mb-4">
        <div class="card card-antigua">
          <div class="card-header card-header-antigua p-3">
            <h5 class="mb-0 fw-bold" id="form-title">
              <i class="bi bi-plus-circle text-warning me-2"></i>Registrar Nuevo Lugar
            </h5>
          </div>
          <div class="card-body p-4">
            <form id="place-form">
              <input type="hidden" id="place-id">
              
              <div class="mb-3">
                <label for="form-name" class="form-label fw-semibold">Nombre del Lugar / Agencia *</label>
                <input type="text" class="form-control" id="form-name" required placeholder="Ej. Agencia Banrural Antigua">
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="form-category" class="form-label fw-semibold">Categoría *</label>
                  <select class="form-select" id="form-category" required></select>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="form-entity" class="form-label fw-semibold">Entidad *</label>
                  <select class="form-select" id="form-entity" required></select>
                </div>
              </div>

              <div class="mb-3">
                <label for="form-location" class="form-label fw-semibold">Ubicación (Municipio) *</label>
                <select class="form-select" id="form-location" required></select>
              </div>

              <div class="mb-3">
                <label for="form-address" class="form-label fw-semibold">Dirección / Referencia *</label>
                <input type="text" class="form-control" id="form-address" required placeholder="Ej. 5ta Avenida Norte #8">
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="form-lat" class="form-label fw-semibold">Latitud *</label>
                  <input type="number" step="any" min="-90" max="90" class="form-control" id="form-lat" required placeholder="14.5586">
                </div>
                <div class="col-md-6 mb-3">
                  <label for="form-lng" class="form-label fw-semibold">Longitud *</label>
                  <input type="number" step="any" min="-180" max="180" class="form-control" id="form-lng" required placeholder="-90.7339">
                </div>
              </div>

              <div class="mb-3">
                <label for="form-description" class="form-label fw-semibold">Descripción</label>
                <textarea class="form-control" id="form-description" rows="2"></textarea>
              </div>

              <div class="d-grid gap-2">
                <button type="submit" class="btn btn-antigua-primary py-2">
                  <i class="bi bi-save me-1"></i> Guardar Registro
                </button>
                <button type="button" class="btn btn-secondary d-none" id="cancel-edit-btn">Cancelar Edición</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Tabla -->
      <div class="col-lg-7">
        <div class="card card-antigua">
          <div class="card-header card-header-antigua p-3">
            <h5 class="mb-0 fw-bold">
              <i class="bi bi-journal-text text-warning me-2"></i>Registros Almacenados
            </h5>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover mb-0 align-middle">
                <thead style="background-color: var(--antigua-yellow); color: var(--antigua-volcano);">
                  <tr>
                    <th class="py-3 ps-3">Nombre</th>
                    <th class="py-3">Categoría</th>
                    <th class="py-3 text-end pe-3">Acciones</th>
                  </tr>
                </thead>
                <tbody id="admin-table-body"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="navbar-antigua text-white text-center py-3 mt-auto">
    <div class="container">
      <p class="mb-0 small">&copy; 2026 Registro de Lugares y Servicios - La Antigua Guatemala.</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
