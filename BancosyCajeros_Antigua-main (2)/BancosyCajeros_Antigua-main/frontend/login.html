<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Sistema - Antigua Guatemala Services</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-bg d-flex align-items-center justify-content-center min-vh-100">

  <div class="card login-card shadow-lg p-4" style="width: 100%; max-width: 420px; z-index: 10;">
    <div class="card-body">
      
      <!-- Icono Celeste -->
      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3 shadow bg-celeste-antigua" style="width: 70px; height: 70px;">
          <i class="bi bi-bank2 fs-1"></i>
        </div>
        <h3 class="fw-bold text-dark mb-1">Acceso Administrativo</h3>
        <p class="text-muted small mb-0">Sistema de Gestión de Lugares & Servicios</p>
        <small class="fw-bold text-secondary">Antigua Guatemala</small>
      </div>

      <!-- Formulario flexible -->
      <form id="login-form">
        <div class="mb-3">
          <label for="login-email" class="form-label fw-semibold text-dark">Correo Electrónico</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control" id="login-email" required placeholder="tu-correo@ejemplo.com">
          </div>
        </div>

        <div class="mb-4">
          <label for="login-password" class="form-label fw-semibold text-dark">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="login-password" required placeholder="••••••••">
          </div>
        </div>

        <button type="submit" class="btn btn-antigua-primary w-100 py-2 mb-3 shadow-sm fw-bold">
          <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión
        </button>
        <a href="index.html" class="btn btn-outline-dark w-100 py-2">
          <i class="bi bi-arrow-left me-1"></i> Volver al Catálogo
        </a>
      </form>

    </div>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      
      // Permite cualquier correo y contraseña ingresados
      const email = document.getElementById('login-email').value;
      
      // Almacenar token de sesión simulado
      localStorage.setItem('token', 'simulated-demo-token');
      localStorage.setItem('user_email', email);
      
      // Redirección inmediata a admin.html
      window.location.href = 'admin.html';
    });
  </script>
</body>
</html>
